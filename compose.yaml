services:
  torrent-manager:
    image: eclipse-temurin:25-jre
    container_name: torrent-manager
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command: ["java", "-jar", "/app/torrent-manager.jar"]
    environment:
      TZ: ${TZ:-UTC}
      SERVER_PORT: "8091"
      QBITTORRENT_URL: ${QBITTORRENT_URL:?Set QBITTORRENT_URL in .env}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:?Set QBITTORRENT_USERNAME in .env}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Create a .env file with QBITTORRENT_PASSWORD}
      TORRENT_MANAGER_DRY_RUN: ${TORRENT_MANAGER_DRY_RUN:-true}
      TORRENT_MANAGER_RETRY_COOLDOWN: ${TORRENT_MANAGER_RETRY_COOLDOWN:-20m}
      TORRENT_MANAGER_FAIR_ROTATION_SLOTS: ${TORRENT_MANAGER_FAIR_ROTATION_SLOTS:-1}
      TRAFFIC_STATS_POLL_INTERVAL: ${TRAFFIC_STATS_POLL_INTERVAL:-1m}
      DOWNLOAD_MONITOR_POLL_INTERVAL: ${DOWNLOAD_MONITOR_POLL_INTERVAL:-1m}
      DOWNLOAD_HISTORY_MAX_ENTRIES: ${DOWNLOAD_HISTORY_MAX_ENTRIES:-1000}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SSL: ${EMAIL_SMTP_SSL:-true}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS:-false}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_NOTIFICATION_TEST_ENDPOINT_ENABLED: ${EMAIL_NOTIFICATION_TEST_ENDPOINT_ENABLED:-false}
      DOWNLOAD_STALL_ALERT_ENABLED: ${DOWNLOAD_STALL_ALERT_ENABLED:-false}
      DOWNLOAD_STALL_ALERT_POLL_INTERVAL: ${DOWNLOAD_STALL_ALERT_POLL_INTERVAL:-1m}
      DOWNLOAD_STALL_ALERT_INITIAL_DELAY: ${DOWNLOAD_STALL_ALERT_INITIAL_DELAY:-2m}
      DOWNLOAD_STALL_ALERT_ZERO_SPEED_THRESHOLD: ${DOWNLOAD_STALL_ALERT_ZERO_SPEED_THRESHOLD:-10KB}
      DOWNLOAD_STALL_ALERT_AFTER: ${DOWNLOAD_STALL_ALERT_AFTER:-20m}
      DOWNLOAD_STALL_ALERT_RECOVERY_SPEED: ${DOWNLOAD_STALL_ALERT_RECOVERY_SPEED:-100KB}
      DOWNLOAD_STALL_ALERT_RECOVERY_WINDOW: ${DOWNLOAD_STALL_ALERT_RECOVERY_WINDOW:-2m}
    volumes:
      - ${APP_DIR:?Set APP_DIR to the absolute deployment folder}/torrent-manager.jar:/app/torrent-manager.jar:ro
      - ${APP_DIR}/logs:/app/logs
      - ${APP_DIR}/data:/app/data
