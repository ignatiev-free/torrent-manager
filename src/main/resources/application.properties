spring.application.name=torrent-manager
logging.file.name=logs/torrent-manager.log

management.endpoints.web.exposure.include=health,info

qbit.base-url=${QBITTORRENT_URL}
qbit.username=${QBITTORRENT_USERNAME}
qbit.password=${QBITTORRENT_PASSWORD:}

torrent-manager.dry-run=${TORRENT_MANAGER_DRY_RUN:true}
torrent-manager.poll-interval=1m
torrent-manager.max-active-downloads=5
torrent-manager.max-stops-per-cycle=1
torrent-manager.slow-window=5m
torrent-manager.minimum-download-speed=400KB
torrent-manager.limited-slow-window=15m
torrent-manager.limited-threshold-ratio=0.40
torrent-manager.minimum-limited-download-speed=50KB
torrent-manager.saturated-limit-ratio=0.80
torrent-manager.minimum-action-interval=5m
torrent-manager.retry-cooldown=20m
torrent-manager.fair-rotation-slots=${TORRENT_MANAGER_FAIR_ROTATION_SLOTS:1}
torrent-manager.no-seeds-timeout=3m
torrent-manager.state-file=data/manager-state.properties

traffic-stats.poll-interval=${TRAFFIC_STATS_POLL_INTERVAL:1m}
traffic-stats.initial-delay=0s
traffic-stats.state-file=${TRAFFIC_STATS_STATE_FILE:data/traffic-state.properties}

download-monitor.poll-interval=${DOWNLOAD_MONITOR_POLL_INTERVAL:1m}
download-monitor.initial-delay=${DOWNLOAD_MONITOR_INITIAL_DELAY:0s}
download-monitor.state-file=${DOWNLOAD_MONITOR_STATE_FILE:data/download-monitor-state.properties}

download-history.history-file=${DOWNLOAD_HISTORY_FILE:data/download-completions.json}
download-history.max-entries=${DOWNLOAD_HISTORY_MAX_ENTRIES:1000}

email-notifications.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
email-notifications.to=${EMAIL_TO:}
email-notifications.worker-interval=${EMAIL_NOTIFICATION_WORKER_INTERVAL:30s}
email-notifications.test-endpoint-enabled=${EMAIL_NOTIFICATION_TEST_ENDPOINT_ENABLED:false}

spring.mail.host=${EMAIL_SMTP_HOST:}
spring.mail.port=${EMAIL_SMTP_PORT:465}
spring.mail.username=${EMAIL_SMTP_USERNAME:}
spring.mail.password=${EMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${EMAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

download-stall-alert.enabled=${DOWNLOAD_STALL_ALERT_ENABLED:false}
download-stall-alert.poll-interval=${DOWNLOAD_STALL_ALERT_POLL_INTERVAL:1m}
download-stall-alert.initial-delay=${DOWNLOAD_STALL_ALERT_INITIAL_DELAY:2m}
download-stall-alert.zero-speed-threshold=${DOWNLOAD_STALL_ALERT_ZERO_SPEED_THRESHOLD:10KB}
download-stall-alert.alert-after=${DOWNLOAD_STALL_ALERT_AFTER:20m}
download-stall-alert.recovery-speed=${DOWNLOAD_STALL_ALERT_RECOVERY_SPEED:100KB}
download-stall-alert.recovery-window=${DOWNLOAD_STALL_ALERT_RECOVERY_WINDOW:2m}
